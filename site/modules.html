    </div>
  </div>

<script src="modules.js"></script>
<script src="script.js"></script>
<script src="release.js"></script>
<script>
(() => {
  const data = window.SOCKET_MODULES || [];
  const groups = document.getElementById("groups");
  const chips = document.getElementById("chips");
  const search = document.getElementById("search");
  const total = data.reduce((sum, c) => sum + c.mods.length, 0);
  let category = "all";

  const esc = (v) => String(v).replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));

  chips.innerHTML = [`<button class="on" data-cat="all">Все · ${total}</button>`]
    .concat(data.map((c) => `<button data-cat="${c.id}">${esc(c.name)} · ${c.mods.length}</button>`))
    .join("");

  function render() {
    const query = search.value.trim().toLowerCase();
    const html = data
      .filter((c) => category === "all" || c.id === category)
      .map((c) => {
        const mods = c.mods.filter(([name, desc]) => !query || (name + " " + desc).toLowerCase().includes(query));
        if (!mods.length) return "";
        return `<section class="mods-group"><h3>${esc(c.name)} <small>${mods.length}</small></h3><div class="mods-grid">${mods
          .map(([name, desc, key, fresh]) => `
            <article class="mcard">
              <div class="mcard-top"><b>${esc(name)}${fresh ? ' <em class="new">new</em>' : ""}</b><span class="sw"></span></div>
              <p>${esc(desc)}</p>
              <span class="k">${key === "—" ? "без клавиши" : "клавиша " + esc(key)}</span>
            </article>`)
          .join("")}</div></section>`;
      })
      .join("");
    groups.innerHTML = html || '<p class="mods-empty">Ничего не нашлось — попробуйте другое слово.</p>';
  }

  chips.addEventListener("click", (e) => {
    const button = e.target.closest("button");
    if (!button) return;
    category = button.dataset.cat;
    chips.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b === button));
    render();
  });
  search.addEventListener("input", render);
  render();
})();
</script>
</body>
