name: Client

on:
  push:
    branches: ['**']
    # теги релизов: v1.2.3 или 1.2.3
    tags: ['v*', '[0-9]*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег существующего релиза, к которому приложить ядро (например 1.1.0)'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # тег релиза: из ручного запуска или из пуша тега
      RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
    defaults:
      run:
        working-directory: client-source
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # для релиза версия ядра берётся из тега (без ведущей v), иначе — из gradle.properties
      - name: Build
        run: |
          chmod +x gradlew
          if [[ -n "$RELEASE_TAG" ]]; then
            ./gradlew build --no-daemon -Pversion="${RELEASE_TAG#v}"
          else
            ./gradlew build --no-daemon
          fi
          rm -f build/libs/*-sources.jar

      - uses: actions/upload-artifact@v4
        with:
          name: socket-client
          path: client-source/build/libs/socket-client-*.jar

      # лоадер ищет в релизах файл socket-client-*.jar
      - name: Attach core to release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: client-source/build/libs/socket-client-*.jar
